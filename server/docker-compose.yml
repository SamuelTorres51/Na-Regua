services:
  postgres:
    image: postgres:16
    container_name: naregua_database
    restart: always
    environment:
      POSTGRES_USER: naregua_user
      POSTGRES_PASSWORD: naregua_pass
      POSTGRES_DB: naregua_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
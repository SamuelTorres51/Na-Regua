[project]
name = "na-regua-api"
version = "0.1.0"
description = "API da plataforma Na Régua"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
    "email-validator",
    "bcrypt",
    "PyJWT",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx"
]